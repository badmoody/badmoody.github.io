<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anon Chat</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color:white;
}

.container{
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header{
  background:#1e293b;
  padding:15px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  letter-spacing:1px;
}

.status{
  text-align:center;
  font-size:12px;
  color:#94a3b8;
  padding:5px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg{
  margin:8px 0;
  padding:12px;
  border-radius:12px;
  max-width:75%;
  word-wrap:break-word;
  animation:fadeIn 0.2s ease;
}

.me{
  background:#2563eb;
  margin-left:auto;
}

.other{
  background:#334155;
}

.input-area{
  display:flex;
  padding:10px;
  background:#1e293b;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

button{
  margin-left:10px;
  padding:12px 16px;
  border:none;
  background:#22c55e;
  color:white;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  background:#16a34a;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(5px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">
  <div class="header">Anon Chat</div>
  <div class="status" id="status">Menghubungkan...</div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="msg" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()">Kirim</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ðŸ”¥ MASUKKAN CONFIG FIREBASE KAMU DI SINI
const firebaseConfig = {
  apiKey: "AIzaSyAXgG6MjRVIpZcXhjRacZp-eMs8Cc3nKds",
  authDomain: "anon-chat-23db1.firebaseapp.com",
  databaseURL: "https://anon-chat-23db1-default-rtdb.firebaseio.com",
  projectId: "anon-chat-23db1",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// RANDOM NAME
function randomName(){
  return "Anon_" + Math.floor(Math.random()*9999);
}

let username = randomName();
let roomId = "";

// JOIN ROOM
async function joinRoom(){
  let snapshot = await db.ref("rooms").once("value");
  let rooms = snapshot.val();

  if(rooms){
    for(let id in rooms){
      let count = rooms[id].users ? Object.keys(rooms[id].users).length : 0;

      if(count === 1){
        roomId = id;
        db.ref("rooms/"+id+"/users").push(username);
        startChat();
        return;
      }
    }
  }

  // buat room baru
  roomId = "room_" + Date.now();

  db.ref("rooms/"+roomId).set({
    users: {[Date.now()]: username},
    messages: {}
  });

  startChat();
}

// START CHAT
function startChat(){
  document.getElementById("status").innerText =
    "Room: " + roomId + " | Nama: " + username;

  db.ref("rooms/"+roomId+"/messages").on("child_added", snap=>{
    let data = snap.val();
    addMessage(data);
  });
}

// ADD MESSAGE UI
function addMessage(data){
  let chat = document.getElementById("chat");

  let div = document.createElement("div");
  div.className = "msg " + (data.name === username ? "me":"other");
  div.innerText = data.name + ": " + data.text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// SEND
function send(){
  let input = document.getElementById("msg");
  let text = input.value.trim();

  if(!text) return;

  db.ref("rooms/"+roomId+"/messages").push({
    name: username,
    text: text
  });

  input.value = "";
}

// START
joinRoom();
</script>

</body>
</html>
