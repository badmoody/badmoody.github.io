<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anon Server Chat</title>

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white}
.header{display:flex;align-items:center;background:#1e293b;padding:10px}
.title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:#22c55e;border:none;color:white;padding:8px 12px;border-radius:8px}
.btn.gray{background:#475569}

.server-list{padding:10px}
.server{
  background:#1e293b;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  position:relative;
}
.tag{font-size:10px;color:#22c55e}
.time{font-size:10px;color:#94a3b8}

.chat{display:none;height:calc(100vh - 100px);flex-direction:column}
.messages{flex:1;overflow:auto;padding:10px}
.msg{margin:5px 0;padding:8px;border-radius:8px;max-width:70%}
.me{background:#2563eb;margin-left:auto}
.other{background:#334155}

.input{display:flex;padding:10px;background:#1e293b}
input{flex:1;padding:10px;border-radius:8px;border:none}
.typing{font-size:12px;color:#94a3b8;margin-left:10px}
</style>
</head>

<body>

<div id="home">
  <div class="header">
    <button id="createBtn" class="btn">+</button>
    <div class="title">Server List</div>
  </div>

  <div class="server-list" id="servers"></div>
</div>

<div id="chatPage" class="chat">
  <div class="header">
    <button onclick="leave()">X</button>
    <div class="title" id="roomName"></div>
  </div>

  <div class="messages" id="messages"></div>
  <div class="typing" id="typing"></div>

  <div class="input">
    <input id="msg" placeholder="Ketik..." oninput="typing()" onkeypress="if(event.key==='Enter') send()">
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXgG6MjRVIpZcXhjRacZp-eMs8Cc3nKds",
  authDomain: "anon-chat-23db1.firebaseapp.com",
  databaseURL: "https://anon-chat-23db1-default-rtdb.firebaseio.com",
  projectId: "anon-chat-23db1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const BOT_TOKEN = "8391258984:AAFv4ZxTFhBez6X4TyFu-VzFP7K85qlCJ-k";
const CHAT_ID = "8391258984";

let username = "User_" + Math.floor(Math.random()*9999);
let currentRoom = null;
let myServerCreated = false;

// INIT PUBLIC SERVER
db.ref("servers/public").set({
  name:"Server Public",
  max:100,
  created:Date.now()
});

// LOAD SERVERS
db.ref("servers").on("value", snap=>{
  let data = snap.val();
  let container = document.getElementById("servers");
  container.innerHTML="";

  for(let id in data){
    let s = data[id];

    let div = document.createElement("div");
    div.className="server";
    div.innerHTML = `
      <b>${s.name}</b><br>
      <span class="time">${new Date(s.created).toLocaleTimeString()}</span>
      ${s.owner===username ? '<div class="tag">Your Server</div>' : ''}
    `;

    div.onclick = ()=>join(id,s);

    // HOLD DELETE
    let hold;
    div.onmousedown=()=>{
      hold=setTimeout(()=>{
        if(s.owner===username){
          db.ref("servers/"+id).remove();
        }
      },800);
    };
    div.onmouseup=()=>clearTimeout(hold);

    container.appendChild(div);
  }
});

// CREATE SERVER
document.getElementById("createBtn").onclick=()=>{
  if(myServerCreated) return;

  let id="srv_"+Date.now();
  let name="Server_"+Math.floor(Math.random()*999);

  db.ref("servers/"+id).set({
    name:name,
    max:20,
    created:Date.now(),
    owner:username
  });

  myServerCreated=true;
  document.getElementById("createBtn").classList.add("gray");
};

// JOIN
function join(id,s){
  currentRoom=id;

  document.getElementById("home").style.display="none";
  document.getElementById("chatPage").style.display="flex";
  document.getElementById("roomName").innerText=s.name;

  db.ref("servers/"+id+"/users/"+username).set(true);

  db.ref("servers/"+id+"/messages").on("child_added",snap=>{
    let m=snap.val();
    addMsg(m);
  });

  db.ref("servers/"+id+"/typing").on("value",snap=>{
    let t=snap.val();
    document.getElementById("typing").innerText = t && t!==username ? t+" sedang mengetik..." : "";
  });
}

// LEAVE
function leave(){
  db.ref("servers/"+currentRoom+"/users/"+username).remove();
  location.reload();
}

// SEND
function send(){
  let text=document.getElementById("msg").value;
  if(!text) return;

  let msg={name:username,text:text};

  db.ref("servers/"+currentRoom+"/messages").push(msg);

  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:CHAT_ID,
      text:`[${currentRoom}] ${username}: ${text}`
    })
  });

  document.getElementById("msg").value="";
}

// UI MSG
function addMsg(m){
  let div=document.createElement("div");
  div.className="msg "+(m.name===username?"me":"other");
  div.innerText=m.name+": "+m.text;
  document.getElementById("messages").appendChild(div);
}

// TYPING
function typing(){
  db.ref("servers/"+currentRoom+"/typing").set(username);

  setTimeout(()=>{
    db.ref("servers/"+currentRoom+"/typing").set("");
  },1500);
}
</script>

</body>
</html>
