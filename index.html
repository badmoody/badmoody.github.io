<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - Zat</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('GB.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            overscroll-behavior-y: none;
            font-family: 'Caveat', cursive;
        }

        .profile-container {
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-pic {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #000000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 15px;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .ig-link {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
        }

        .ig-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 12px;
            -webkit-user-drag: none;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8));
        }

        .profile-name {
            font-family: 'Permanent Marker', cursive;
            font-size: 40px;
            color: #b3b3b3;
            -webkit-text-stroke: 1px #ffffff;
            letter-spacing: 3px;
            text-shadow: 4px 4px 6px rgba(0, 0, 0, 0.9);
            margin-bottom: 25px;
            text-align: center;
        }

        .info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            font-size: 26px;
            color: #b3b3b3;
            -webkit-text-stroke: 0.5px #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 1);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 700;
        }

        .info-value {
            font-weight: 700;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="Tension.mp3"></audio>

    <div class="profile-container">
        <img src="profile.png" alt="Profile" class="profile-pic" draggable="false">
        
        <a id="ig-btn" class="ig-link">
            <img src="ig.png" alt="Instagram" class="ig-icon" draggable="false">
        </a>

        <h1 class="profile-name">Zat</h1>

        <div class="info-list">
            <div class="info-item">
                <span class="info-label">Name</span>
                <span class="info-value">Zat</span>
            </div>
            <div class="info-item">
                <span class="info-label">Religion</span>
                <span class="info-value">Privacy</span>
            </div>
            <div class="info-item">
                <span class="info-label">Age</span>
                <span class="info-value"><span id="dynamic-age">14</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">Birthday</span>
                <span class="info-value">May 15, 2012</span>
            </div>
            <div class="info-item">
                <span class="info-label">Origin</span>
                <span class="info-value">Privacy</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || e.keyCode === 116) e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.keyCode === 82)) e.preventDefault();
            if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C')) e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) e.preventDefault();
        });

        function calculateAge() {
            const birthDate = new Date('2012-05-15');
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            document.getElementById('dynamic-age').textContent = age;
        }
        calculateAge();

        const bgMusic = document.getElementById('bg-music');
        const fadeDuration = 3;
        let musicStarted = false;

        function playMusic() {
            if (!musicStarted) {
                bgMusic.volume = 0;
                let playPromise = bgMusic.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        musicStarted = true;
                        let volume = 0;
                        let interval = setInterval(function() {
                            if (volume < 1.0) {
                                volume += 0.05;
                                bgMusic.volume = Math.min(1, volume);
                            } else {
                                clearInterval(interval);
                            }
                        }, 100);
                    }).catch(error => {
                        
                    });
                }
            }
        }

        window.addEventListener('load', playMusic);
        document.addEventListener('click', playMusic);
        document.addEventListener('touchstart', playMusic);

        bgMusic.addEventListener('timeupdate', function() {
            const timeLeft = bgMusic.duration - bgMusic.currentTime;
            if (timeLeft <= fadeDuration && bgMusic.volume > 0) {
                let newVolume = timeLeft / fadeDuration;
                bgMusic.volume = Math.max(0, newVolume);
            }
        });

        bgMusic.addEventListener('ended', function() {
            bgMusic.currentTime = 0;
            bgMusic.volume = 0;
            bgMusic.play();
            let volume = 0;
            let interval = setInterval(function() {
                if (volume < 1.0) {
                    volume += 0.05;
                    bgMusic.volume = Math.min(1, volume);
                } else {
                    clearInterval(interval);
                }
            }, 100);
        });

        const igBtn = document.getElementById('ig-btn');
        igBtn.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'https://www.instagram.com/real.zatt?igsh=MTc3aHZmbnB0ZDc0YQ==';
        });
    </script>
</body>
</html>
