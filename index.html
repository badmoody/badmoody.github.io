<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Mencegah zoom layar agar UI tetap stabil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - Zat</title>
    
    <!-- Import Font Gaya Coretan (Graffiti & Handwriting) dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Permanent+Marker&display=swap" rel="stylesheet">

    <style>
        /* Mengatur Font dan Reset Dasar, serta Anti-Copy Text */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Mencegah Teks Disalin */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; 
        }

        /* Mengatur Background dan Anti-Refresh Mobile */
        body {
            background-image: url('GB.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            /* Posisi dinaikkan ke atas (tidak di tengah banget) */
            align-items: flex-start;
            padding-top: 60px; 
            
            /* Mencegah Pull-to-refresh di HP */
            overscroll-behavior-y: none; 
        }

        /* Overlay Awal untuk Mengizinkan Audio Play */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 1s ease;
            font-family: 'Caveat', cursive;
            font-size: 30px;
        }

        /* Container Profile Tanpa Background Putih */
        .profile-container {
            width: 100%;
            max-width: 380px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Style Profile Picture (Dikecilkan & Pinggiran Hitam) */
        .profile-pic {
            width: 105px; /* Foto dikecilkan */
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #000000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 15px; /* Jarak ke icon IG */
            
            /* Mencegah Gambar ditarik / diseret */
            -webkit-user-drag: none;
        }

        /* Ikon Instagram & Link */
        .ig-link {
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .ig-link:hover {
            transform: scale(1.15); /* Efek membesar saat disentuh */
        }

        .ig-icon {
            width: 40px; /* Ukuran icon IG */
            height: 40px;
            object-fit: contain;
            /* Mencegah Gambar ditarik */
            -webkit-user-drag: none;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8));
        }

        /* Style Judul / Nama (Gaya Coretan Permanent Marker & Besar) */
        .profile-name {
            font-family: 'Permanent Marker', cursive;
            font-size: 40px; /* Teks dibesarkan */
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 4px 4px 6px rgba(0, 0, 0, 0.9), -1px -1px 4px rgba(0,0,0,0.7);
            margin-bottom: 25px;
            text-align: center;
        }

        /* Style List Data Diri (Gaya Tulisan Tangan Keren) */
        .info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.5); /* Garis putus-putus seperti coretan */
            font-family: 'Caveat', cursive;
            font-size: 26px; /* Teks dibesarkan */
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 1), -1px -1px 3px rgba(0,0,0,0.8);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 700;
        }

        .info-value {
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Layar klik pertama agar musik bisa diputar oleh Browser -->
    <div id="start-overlay">
        <h2>Tap to Enter</h2>
    </div>

    <!-- Audio Player (Disembunyikan) -->
    <audio id="bg-music" src="Tension.mp3"></audio>

    <!-- UI Profile -->
    <div class="profile-container">
        <!-- Foto Profil dengan proteksi download -->
        <img src="profile.png" alt="Profile Picture" class="profile-pic" oncontextmenu="return false;" draggable="false">
        
        <!-- Ikon IG, link ini akan mendeteksi aplikasi IG otomatis di Android/iOS -->
        <a href="https://www.instagram.com/real.zatt?igsh=MTc3aHZmbnB0ZDc0YQ==" target="_blank" class="ig-link">
            <img src="ig.png" alt="Instagram" class="ig-icon" oncontextmenu="return false;" draggable="false">
        </a>

        <h1 class="profile-name">Zat</h1>

        <div class="info-list">
            <div class="info-item">
                <span class="info-label">Nama</span>
                <span class="info-value">Zat</span>
            </div>
            <div class="info-item">
                <span class="info-label">Agama</span>
                <span class="info-value">Privacy</span>
            </div>
            <div class="info-item">
                <span class="info-label">Age</span>
                <span class="info-value"><span id="dynamic-age">14</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">Birthday</span>
                <span class="info-value">15 Mei 2012</span>
            </div>
            <div class="info-item">
                <span class="info-label">Origin</span>
                <span class="info-value">Privacy</span>
            </div>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT -->
    <script>
        // --- 1. PROTEKSI HALAMAN (ANTI-REFRESH & ANTI-INSPECT) ---
        // Mencegah Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Mencegah Tombol Keyboard (F5, Ctrl+R, F12)
        document.addEventListener('keydown', function(e) {
            // Blokir F5
            if (e.key === 'F5' || e.keyCode === 116) {
                e.preventDefault();
            }
            // Blokir Ctrl+R atau Cmd+R
            if ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.keyCode === 82)) {
                e.preventDefault();
            }
            // Blokir F12 (Inspect Element)
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
            }
            // Blokir Ctrl+Shift+I / J / U
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')) {
                e.preventDefault();
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
            }
        });

        // --- 2. SISTEM UMUR OTOMATIS ---
        function calculateAge() {
            const birthDate = new Date('2012-05-15');
            const today = new Date();
            
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            document.getElementById('dynamic-age').textContent = age;
        }
        calculateAge();

        // --- 3. SISTEM AUDIO HALUS (FADE IN / FADE OUT LOOP) ---
        const bgMusic = document.getElementById('bg-music');
        const overlay = document.getElementById('start-overlay');
        const fadeDuration = 3; 

        overlay.addEventListener('click', function() {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 1000);

            bgMusic.volume = 0; 
            bgMusic.play();
            fadeIn(bgMusic);
        });

        bgMusic.addEventListener('timeupdate', function() {
            const timeLeft = bgMusic.duration - bgMusic.currentTime;
            if (timeLeft <= fadeDuration && bgMusic.volume > 0) {
                let newVolume = timeLeft / fadeDuration;
                bgMusic.volume = Math.max(0, newVolume); 
            }
        });

        bgMusic.addEventListener('ended', function() {
            bgMusic.currentTime = 0; 
            bgMusic.volume = 0;      
            bgMusic.play();          
            fadeIn(bgMusic);         
        });

        function fadeIn(audioElement) {
            let volume = 0;
            let interval = setInterval(function() {
                if (volume < 1.0) {
                    volume += 0.05; 
                    audioElement.volume = Math.min(1, volume);
                } else {
                    clearInterval(interval); 
                }
            }, 100); 
        }
    </script>
</body>
</html>
