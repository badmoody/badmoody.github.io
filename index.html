<!DOCTYPE html>
<html>
<head>
  <title>Status Viewer</title>
</head>
<body>

<h2>Status Orang</h2>
<div id="feed"></div>

<script>
const JSON_URL = "data.json"; // atau link github kamu

async function load() {
  let res = await fetch(JSON_URL);
  let data = await res.json();

  let html = "";

  data.forEach(m => {
    if (m.type === "text") {
      html += `<p>${m.text}</p>`;
    }

    if (m.type === "photo") {
      html += `<img src="${m.url}" width="200"><br>`;
    }

    if (m.type === "video") {
      html += `<video src="${m.url}" width="250" controls></video><br>`;
    }
  });

  document.getElementById("feed").innerHTML = html;
}

load();
setInterval(load, 3000);
</script>

</body>
</html>
