<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anon Chat Pro</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#0f172a;
  color:white;
}

.container{
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header{
  background:#1e293b;
  padding:15px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
}

.status{
  text-align:center;
  font-size:12px;
  color:#94a3b8;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg{
  margin:6px 0;
  padding:10px;
  border-radius:10px;
  max-width:75%;
}

.me{
  background:#2563eb;
  margin-left:auto;
}

.other{
  background:#334155;
}

.input-area{
  display:flex;
  padding:10px;
  background:#1e293b;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
}

button{
  margin-left:10px;
  padding:12px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">Anon Chat Pro</div>
  <div class="status" id="status">Menghubungkan...</div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="msg" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()">Kirim</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ✅ CONFIG KAMU (SUDAH DIPASANG)
const firebaseConfig = {
  apiKey: "AIzaSyAXgG6MjRVIpZcXhjRacZp-eMs8Cc3nKds",
  authDomain: "anon-chat-23db1.firebaseapp.com",
  databaseURL: "https://anon-chat-23db1-default-rtdb.firebaseio.com",
  projectId: "anon-chat-23db1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// RANDOM NAME
function randomName(){
  return "Anon_" + Math.floor(Math.random()*9999);
}

let username = randomName();
let roomId = "";

// 🔥 JOIN FIX (ANTI BUG)
async function joinRoom(){
  let waitingRef = db.ref("waiting");

  let snap = await waitingRef.get();

  if(snap.exists()){
    // ADA YANG NUNGGU → JOIN
    let data = snap.val();
    roomId = data.roomId;

    await db.ref("rooms/"+roomId+"/users").push(username);
    await waitingRef.remove();

    startChat(true);
  }else{
    // GA ADA → JADI YANG NUNGGU
    roomId = "room_" + Date.now();

    await db.ref("rooms/"+roomId).set({
      users: {},
      messages: {}
    });

    await db.ref("rooms/"+roomId+"/users").push(username);

    await waitingRef.set({
      roomId: roomId
    });

    startChat(false);
  }
}

// START CHAT
function startChat(connected){
  let status = document.getElementById("status");

  if(connected){
    status.innerText = "Terhubung dengan orang lain";
  }else{
    status.innerText = "Menunggu pasangan...";
  }

  // LISTEN USER
  db.ref("rooms/"+roomId+"/users").on("value", snap=>{
    let count = snap.numChildren();

    if(count === 2){
      status.innerText = "Terhubung dengan orang lain";
    }
  });

  // LISTEN MESSAGE
  db.ref("rooms/"+roomId+"/messages").on("child_added", snap=>{
    let data = snap.val();
    addMessage(data);
  });
}

// UI MESSAGE
function addMessage(data){
  let chat = document.getElementById("chat");

  let div = document.createElement("div");
  div.className = "msg " + (data.name === username ? "me":"other");
  div.innerText = data.name + ": " + data.text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// SEND
function send(){
  let input = document.getElementById("msg");
  let text = input.value.trim();

  if(!text) return;

  db.ref("rooms/"+roomId+"/messages").push({
    name: username,
    text: text
  });

  input.value = "";
}

// START
joinRoom();
</script>

</body>
</html>
