<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#16181d 0%,#000 75%)}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease;pointer-events:none}
body.has-image #photo{opacity:1}
#empty{display:flex;align-items:center;justify-content:center;transition:opacity .3s ease,transform .3s ease}
body.has-image #empty{opacity:0;pointer-events:none;transform:scale(.9)}
.add{width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s ease,transform .25s ease,border-color .25s ease;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.add:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);transform:scale(1.06)}
.add:active{transform:scale(.96)}
.add svg{width:34px;height:34px}
#controls{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .3s ease,transform .3s ease}
body.has-image.show-ui #controls{opacity:1;pointer-events:auto;transform:none}
#bar{display:flex;gap:10px;padding:8px;border-radius:999px;background:rgba(20,22,27,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.btn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.92)}
.btn.primary{background:#fff;color:#000}
.btn.primary:hover{background:#e8e8ec}
.btn.on{background:rgba(255,255,255,.2)}
.btn svg{width:22px;height:22px}
#history{width:min(920px,100%);max-height:0;opacity:0;overflow:hidden;border-radius:22px;background:rgba(20,22,27,.62);border:1px solid transparent;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);transition:max-height .4s cubic-bezier(.2,.8,.2,1),opacity .3s ease,border-color .3s ease}
#history.open{max-height:170px;opacity:1;border-color:rgba(255,255,255,.12);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#strip{display:flex;gap:12px;padding:14px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;min-height:142px;align-items:center}
#strip::-webkit-scrollbar{height:6px}
#strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px}
.thumb{position:relative;flex:0 0 auto;width:96px;height:96px;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#111;transition:transform .2s ease,border-color .2s ease}
.thumb:hover{transform:translateY(-3px)}
.thumb.active{border-color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.del{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s ease,background .2s ease}
.del svg{width:12px;height:12px}
.thumb:hover .del{opacity:1}
.del:hover{background:rgba(220,40,40,.9)}
@media (hover:none){.del{opacity:1}}
#drop{position:fixed;inset:0;border:2px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.06);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:10}
body.dragging #drop{opacity:1}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="stage">
<img id="photo" alt="">
<div id="empty">
<button class="add" id="addMain" aria-label="Tambah foto">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</div>
<div id="controls">
<div id="history"><div id="strip"></div></div>
<div id="bar">
<button class="btn" id="histBtn" aria-label="Riwayat">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
</button>
<button class="btn primary" id="addBtn" aria-label="Tambah foto">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<button class="btn" id="fsBtn" aria-label="Layar penuh">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
</div>
</div>
<div id="drop"></div>
<input type="file" id="file" accept="image/*" multiple>
<script>
(function(){
var DB_NAME="photo-viewer";
var STORE="photos";
var body=document.body;
var photo=document.getElementById("photo");
var strip=document.getElementById("strip");
var historyEl=document.getElementById("history");
var histBtn=document.getElementById("histBtn");
var fileInput=document.getElementById("file");
var items=[];
var activeId=null;
var hideTimer=null;
var dragDepth=0;

function openDb(){
return new Promise(function(resolve,reject){
var req=indexedDB.open(DB_NAME,1);
req.onupgradeneeded=function(){req.result.createObjectStore(STORE,{keyPath:"id",autoIncrement:true})};
req.onsuccess=function(){resolve(req.result)};
req.onerror=function(){reject(req.error)};
});
}

var dbPromise=openDb().catch(function(){return null});

function run(mode,fn){
return dbPromise.then(function(db){
if(!db)return null;
return new Promise(function(resolve,reject){
var tx=db.transaction(STORE,mode);
var result=fn(tx.objectStore(STORE));
tx.oncomplete=function(){resolve(result&&result.result!==undefined?result.result:null)};
tx.onerror=function(){reject(tx.error)};
});
});
}

function saveBlob(blob){
var record={blob:blob,added:Date.now()};
return dbPromise.then(function(db){
if(!db)return{id:Date.now()+Math.random(),blob:blob,added:record.added};
return new Promise(function(resolve,reject){
var tx=db.transaction(STORE,"readwrite");
var req=tx.objectStore(STORE).add(record);
tx.oncomplete=function(){record.id=req.result;resolve(record)};
tx.onerror=function(){reject(tx.error)};
});
});
}

function removeRecord(id){
return run("readwrite",function(store){return store.delete(id)}).catch(function(){});
}

function loadAll(){
return run("readonly",function(store){return store.getAll()}).then(function(list){return list||[]}).catch(function(){return[]});
}

function hydrate(record){
record.url=URL.createObjectURL(record.blob);
return record;
}

function icon(){
return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
}

function renderHistory(){
strip.innerHTML="";
items.forEach(function(item){
var thumb=document.createElement("div");
thumb.className="thumb"+(item.id===activeId?" active":"");
var img=document.createElement("img");
img.src=item.url;
img.alt="";
img.draggable=false;
var del=document.createElement("button");
del.className="del";
del.setAttribute("aria-label","Hapus");
del.innerHTML=icon();
del.addEventListener("click",function(e){
e.stopPropagation();
remove(item);
});
thumb.addEventListener("click",function(){
show(item);
});
thumb.appendChild(img);
thumb.appendChild(del);
strip.appendChild(thumb);
});
}

function enterFullscreen(){
var el=document.documentElement;
if(document.fullscreenElement||!el.requestFullscreen)return;
try{
var p=el.requestFullscreen();
if(p&&p.catch)p.catch(function(){});
}catch(e){}
}

function toggleFullscreen(){
if(document.fullscreenElement){
document.exitFullscreen();
}else{
enterFullscreen();
}
}

function show(item){
activeId=item.id;
photo.src=item.url;
body.classList.add("has-image");
renderHistory();
enterFullscreen();
}

function remove(item){
var index=items.indexOf(item);
if(index<0)return;
items.splice(index,1);
removeRecord(item.id);
URL.revokeObjectURL(item.url);
if(activeId===item.id){
if(items.length){
show(items[Math.min(index,items.length-1)]);
}else{
activeId=null;
photo.removeAttribute("src");
body.classList.remove("has-image","show-ui");
historyEl.classList.remove("open");
histBtn.classList.remove("on");
if(document.fullscreenElement)document.exitFullscreen();
renderHistory();
}
}else{
renderHistory();
}
}

function openHistory(open){
historyEl.classList.toggle("open",open);
histBtn.classList.toggle("on",open);
}

function pokeUi(){
if(!body.classList.contains("has-image"))return;
body.classList.add("show-ui");
clearTimeout(hideTimer);
hideTimer=setTimeout(function(){
if(!document.querySelector("#controls:hover")){
body.classList.remove("show-ui");
}
},3500);
}

function addFiles(fileList){
var files=Array.prototype.filter.call(fileList,function(f){return f.type.indexOf("image/")===0});
if(!files.length)return;
var last=null;
var chain=Promise.resolve();
files.forEach(function(file){
chain=chain.then(function(){
return saveBlob(file).then(function(record){
last=hydrate(record);
items.unshift(last);
});
});
});
chain.then(function(){
if(last){
show(last);
openHistory(true);
pokeUi();
}
});
}

function pick(){
fileInput.value="";
fileInput.click();
}

fileInput.addEventListener("change",function(){
if(fileInput.files&&fileInput.files.length)addFiles(fileInput.files);
});

document.getElementById("addMain").addEventListener("click",pick);
document.getElementById("addBtn").addEventListener("click",function(){
pick();
});
document.getElementById("fsBtn").addEventListener("click",toggleFullscreen);
histBtn.addEventListener("click",function(){
openHistory(!historyEl.classList.contains("open"));
pokeUi();
});

["mousemove","touchstart","keydown"].forEach(function(evt){
document.addEventListener(evt,pokeUi,{passive:true});
});

document.getElementById("stage").addEventListener("click",function(e){
if(!body.classList.contains("has-image"))return;
if(e.target.closest("#empty"))return;
if(body.classList.contains("show-ui")){
body.classList.remove("show-ui");
openHistory(false);
}else{
pokeUi();
}
});

document.addEventListener("keydown",function(e){
if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
if(!items.length)return;
var index=items.findIndex(function(i){return i.id===activeId});
var next=e.key==="ArrowRight"?index+1:index-1;
if(next>=0&&next<items.length)show(items[next]);
}
if(e.key==="h"||e.key==="H"){
openHistory(!historyEl.classList.contains("open"));
}
});

window.addEventListener("dragenter",function(e){
e.preventDefault();
dragDepth++;
body.classList.add("dragging");
});
window.addEventListener("dragover",function(e){e.preventDefault()});
window.addEventListener("dragleave",function(e){
e.preventDefault();
dragDepth=Math.max(0,dragDepth-1);
if(!dragDepth)body.classList.remove("dragging");
});
window.addEventListener("drop",function(e){
e.preventDefault();
dragDepth=0;
body.classList.remove("dragging");
if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files);
});

loadAll().then(function(list){
list.sort(function(a,b){return b.id-a.id});
items=list.map(hydrate);
renderHistory();
if(items.length){
activeId=items[0].id;
photo.src=items[0].url;
body.classList.add("has-image");
renderHistory();
pokeUi();
}
});
})();
</script>
</body>
</html>
