<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kustomisasi Kertas</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto; 
            font-weight: 700;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px 30px;
            border-radius: 12px;
            border: 1px solid #333333;
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 22px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .template-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            width: 100%;
        }

        .template-item {
            width: 80px;
            height: 80px;
            border: 2px solid #333333;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            background-color: #2a2a2a;
        }

        .template-item.active {
            border-color: #6366f1;
        }

        .template-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; 
        }

        .canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #151515;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #333333;
        }

        canvas {
            max-width: 100%;
            height: auto;
            max-height: 40vh; 
            object-fit: contain;
            border-radius: 4px;
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }

        .custom-color-btn {
            position: relative;
            padding: 0 15px;
            height: 38px;
            background-color: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 8px; 
            font-size: 15px;
            font-weight: 700;
            flex-shrink: 0;
            color: #ffffff;
        }

        .custom-color-btn input[type="color"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .color-palette {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            flex-grow: 1;
            scrollbar-width: thin;
            scrollbar-color: #ffffff #2a2a2a;
        }

        .color-palette::-webkit-scrollbar {
            height: 6px;
            display: block; 
        }
        
        .color-palette::-webkit-scrollbar-track {
            background: #2a2a2a;
            border-radius: 10px;
        }
        
        .color-palette::-webkit-scrollbar-thumb {
            background-color: #ffffff;
            border-radius: 10px;
        }

        .color-swatch {
            min-width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #333333;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .download-btn.clicked {
            transform: scale(0.96);
            background-color: #4f46e5;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
        }

        .warning-text {
            display: none;
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            font-weight: 700;
            width: 100%;
        }

        .footer-text {
            width: 100%;
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #333333;
            font-size: 14px;
            color: #888888;
            letter-spacing: 0.5px;
            line-height: 1.8;
            font-weight: 700;
        }

        .profile-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container">
        <h1>Kustomisasi Kertas</h1>

        <div class="template-selector" id="templateSelector">
            <div class="template-item active" onclick="changeTemplate('paper1.png', this)">
                <img src="paper1.png" alt="Paper 1" onerror="this.src='https://via.placeholder.com/150/2a2a2a/ffffff?text=Paper+1'">
            </div>
            <div class="template-item" onclick="changeTemplate('paper2.png', this)">
                <img src="paper2.png" alt="Paper 2" onerror="this.src='https://via.placeholder.com/150/2a2a2a/ffffff?text=Paper+2'">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="controls-wrapper">
            <div class="custom-color-btn">
                Atur Warna
                <input type="color" id="colorPicker" value="#6366f1">
            </div>

            <div class="color-palette" id="colorPalette"></div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="triggerDownload()">Download Gambar</button>
        <div class="warning-text" id="warningText">Jika ada kesalahan dalam meng-download Paper, Klik ulang Download</div>
        
        <div class="footer-text">
            Pembuat: zat<br>
            Profil Lengkap <a href="https://badmoody.github.io" target="_blank" class="profile-link">badmoody.github.io</a>
        </div>
    </div>

    <script>
        let currentImageSrc = 'paper1.png'; 
        let currentColor = '#6366f1';
        let isRendering = false;
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const preloadedImages = {
            'paper1.png': new Image(),
            'paper2.png': new Image()
        };

        const colors = [
            '#ffffff', '#e2e8f0', '#94a3b8', '#475569', '#0f172a', '#000000',
            '#ef4444', '#dc2626', '#b91c1c', '#7f1d1d', 
            '#f97316', '#ea580c', '#c2410c', '#7c2d12',
            '#f59e0b', '#d97706', '#b45309', '#713f12',
            '#eab308', '#ca8a04', '#a16207', '#713f12',
            '#84cc16', '#65a30d', '#4d7c0f', '#3f6212',
            '#22c55e', '#16a34a', '#15803d', '#14532d',
            '#10b981', '#059669', '#047857', '#064e3b',
            '#14b8a6', '#0d9488', '#0f766e', '#134e4a',
            '#06b6d4', '#0891b2', '#0e7490', '#164e63',
            '#0ea5e9', '#0284c7', '#0369a1', '#0c4a6e',
            '#3b82f6', '#2563eb', '#1d4ed8', '#1e3a8a',
            '#6366f1', '#4f46e5', '#4338ca', '#312e81',
            '#8b5cf6', '#7c3aed', '#6d28d9', '#4c1d95',
            '#a855f7', '#9333ea', '#7e22ce', '#581c87',
            '#d946ef', '#c026d3', '#a21caf', '#701a75',
            '#ec4899', '#db2777', '#be185d', '#831843',
            '#f43f5e', '#e11d48', '#be123c', '#881337'
        ];

        const paletteContainer = document.getElementById('colorPalette');
        colors.forEach(color => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color;
            swatch.onclick = () => {
                currentColor = color;
                document.getElementById('colorPicker').value = color;
                requestRender();
            };
            paletteContainer.appendChild(swatch);
        });

        function initPreload() {
            let loadedCount = 0;
            const sources = ['paper1.png', 'paper2.png'];
            
            sources.forEach(src => {
                preloadedImages[src].onload = () => {
                    loadedCount++;
                    if (loadedCount === sources.length || src === currentImageSrc) {
                        applyActiveImage();
                    }
                };
                preloadedImages[src].src = src;
            });
        }

        function changeTemplate(src, element) {
            const items = document.querySelectorAll('.template-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            
            currentImageSrc = src;
            applyActiveImage();
        }

        function applyActiveImage() {
            const activeImg = preloadedImages[currentImageSrc];
            if (activeImg.naturalWidth) {
                canvas.width = activeImg.naturalWidth;
                canvas.height = activeImg.naturalHeight;
                requestRender();
            }
        }

        function requestRender() {
            if (!isRendering) {
                isRendering = true;
                requestAnimationFrame(() => {
                    renderCanvas();
                    isRendering = false;
                });
            }
        }

        function renderCanvas() {
            const activeImg = preloadedImages[currentImageSrc];
            if (!activeImg.naturalWidth) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(activeImg, 0, 0, canvas.width, canvas.height);

            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = currentColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';
        }

        document.getElementById('colorPicker').addEventListener('input', function(e) {
            currentColor = e.target.value;
            requestRender();
        });

        function triggerDownload() {
            const btn = document.getElementById('downloadBtn');
            btn.classList.add('clicked');
            
            setTimeout(() => {
                btn.classList.remove('clicked');
            }, 200);

            document.getElementById('warningText').style.display = 'block';
            
            try {
                const link = document.createElement('a');
                link.download = `Paper-${currentColor}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            } catch (error) {
            }
        }

        window.onload = () => {
            initPreload();
        };
    </script>
</body>
</html>
